<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-clean-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Símbolo Isotipo à Esquerda -->
  <g transform="translate(4, 2) scale(0.58)">
    <!-- Arco Esquerdo -->
    <path
      d="M 60 28 C 44 28 22 40 22 64 C 22 84 40 96 60 102 C 48 88 38 78 38 64 C 38 48 48 38 60 38"
      fill="#059669"
    />
    <!-- Arco Direito -->
    <path
      d="M 60 28 C 76 28 98 40 98 64 C 98 84 80 96 60 102 C 72 88 82 78 82 64 C 82 48 72 38 60 38"
      fill="url(#logo-clean-grad)"
    />
    <!-- Cruzamento Central -->
    <path
      d="M 44 68 C 52 76 60 82 60 82 C 60 82 68 76 76 68 C 70 60 60 56 60 56 C 60 56 50 60 44 68 Z"
      fill="#10B981"
    />
    <!-- Ponto do Estudante -->
    <circle cx="60" cy="22" r="8" fill="#10B981" />
    <circle cx="60" cy="22" r="4" fill="#FFFFFF" />
  </g>

  <!-- Tipografia "REDE ATIVA" à Direita -->
  <text
    x="80"
    y="40"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="1"
    fill="#0F172A"
  >
    REDE ATIVA
  </text>
  <text
    x="80.5"
    y="56"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="9"
    font-weight="700"
    letter-spacing="2.5"
    fill="#059669"
  >
    BUSCA ATIVA • LIVRO DE ATAS
  </text>
</svg>
