name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:dummy@127.0.0.1:5432/redeativa_phase01_synthetic?connection_limit=1
      DIRECT_URL: postgresql://ci:dummy@127.0.0.1:5432/redeativa_phase01_synthetic
      NEXTAUTH_SECRET: ci-testing-dummy-secret-minimum-32-chars-long
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: dummy
          POSTGRES_DB: redeativa_phase01_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d redeativa_phase01_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Migrate Synthetic Test Database
        run: npm run db:migrate:deploy

      - name: Run Vitest Test Suites
        run: npm test -- --testTimeout=20000
        env:
          REDEATIVA_TEST_ISOLATED_DB: "1"

      - name: Build Next.js Application (Turbopack)
        run: npm run build
        env:
          VERCEL: "0"
